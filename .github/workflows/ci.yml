name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validar infraestrutura sem backend
        run: |
          terraform fmt -check -recursive infra
          for ambiente in hml prod; do
            terraform -chdir="infra/environments/$ambiente" init -backend=false -input=false
            terraform -chdir="infra/environments/$ambiente" validate
          done
